################################################################
# Set any variables we need
variables:
  COMPOSER_MEMORY_LIMIT:  -1

################################################################
# Defined Pipeline Stages
stages:
  - tests

################################################################
# Functional Tests
################################################################

.core_tests:    &core_tests
    stage:      tests
    tags:
        - Dedicated
    ################################################################################
    # Install & Configure Environnement
    before_script:
        # Install Dolibarr
        - cat $CI_PROJECT_DIR/src/Resources/gitlab-ci/install_dolibarr.sh | sh
        # Install Module
        - cat $CI_PROJECT_DIR/src/Resources/gitlab-ci/install_module.sh | bash
    ################################################################################
    # Run Test Script
    script:
        # Move to Dolibarr Root Dir
        - cd /var/www/html/htdocs/custom
        # Execute Composer
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/main/ci/composer.sh  | sh
        # Execute Grumphp Testsuite
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/main/ci/grumphp.sh  | sh
        # Execute PhpUnit Tests
        - php vendor/bin/phpunit
    ################################################################################
    # Run After Script
    after_script:
      - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/main/ci/after.sh | sh

################################################################
# One job per PHP / Dolibarr pair. Each matrix entry holds a single
# value per variable, so this lists the 7 supported pairs and does
# not expand into a cartesian product.
tests:
    <<: *core_tests
    image:  registry.gitlab.com/badpixxel-projects/php-sdk:php-$PHP_VERSION
    parallel:
        matrix:
            - PHP_VERSION:      "8.3"
              DOLIBARR_VERSION: "24.0"
            - PHP_VERSION:      "8.3"
              DOLIBARR_VERSION: "22.0"
            - PHP_VERSION:      "8.2"
              DOLIBARR_VERSION: "20.0"
            - PHP_VERSION:      "8.1"
              DOLIBARR_VERSION: "18.0"
            - PHP_VERSION:      "8.0"
              DOLIBARR_VERSION: "16.0"
            - PHP_VERSION:      "7.4"
              DOLIBARR_VERSION: "14.0"
            - PHP_VERSION:      "7.4"
              DOLIBARR_VERSION: "12.0"
